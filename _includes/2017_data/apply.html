<section id="apply">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Be a Part of Something Extraordinary</h2>
        <h3 class="section-subheading">It doesn't matter if you're an engineer, a philosiphy major, or a high school dropout.<br><br>If you have a passion for creating things, we want you on our team.</h3>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <form name="application" id="contactForm" action="https://formspree.io/hughferguson25@gmail.com" method="POST" novalidate>
            <div class="row">
              <div class="col-md-6">
                <div class="control-group form-group">
		<input type="hidden" name="_next" value="http://operationspace.org">
                  <input type="text" class="form-control" name="name" placeholder="Your Name *" id="name" required data-validation-required-message="Please enter your name">
                  <p class="help-block text-danger"></p>
                </div>
                <div class="control-group form-group">
                  <input type="email" class="form-control" name="_replyto" placeholder="Your Email *" id="email" required data-validation-required-message="Please enter your email address" maxlength="25">
                  <p class="help-block text-danger"></p>
                </div>
                <div class="control-group form-group">
                  <input type="tel" class="form-control" name="phone" placeholder="Your Phone" id="phone">
                  <p class="help-block text-danger"></p>
                </div>
                <div class="section-subheading text-muted">
                  Resume
                  <br>
                  <input type="file" name="upload" accept="resume/pdf, resume/jpg">
                </div>
              </div>
              <div class="col-md-6" style="padding:0;">
                <div class="control-group form-group">
                  <textarea class="form-control" name="education/experience" placeholder="Your Education/Experience *" id="message" required data-validation-required-message="Please explain any prior education, experience, or credentials" rows=4 maxlength="1000"></textarea>
                  <p class="help-block text-danger"></p>
                </div>
              </div>
              <div class="col-md-6" style="padding:0;">
                <div class="control-group form-group">
                  <textarea class="form-control" name="anythingElse" placeholder="Please list anything else you might want to add" id="message" rows=4 maxlength="1000"></textarea>
                  <p class="help-block text-danger"></p>
                </div>
              </div>
              <div class="clearfix"></div>
              <div class="col-lg-12 text-center">
                <div id="success"></div>
                <button type="submit" value="Send" class="btn btn-xl">Apply Now</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
