<!-- Portfolio Grid Section -->
    <section id="speakers" class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Our Team</h2>
                    <h3 class="section-subheading text-muted"></h3>
                </div>
            </div>
            <div class="row">
            {% for post in site.categories.2017_teams %}
                <div class="col-md-4 col-sm-6 speakers-item">
                    <a href="#{{ post.name }}" class="speakers-link" data-toggle="modal">
                        <div class="speakers-hover">
                            <div class="speakers-hover-content">
                                <i class="fa fa-plus fa-3x"></i>
                            </div>
                        </div>
                        <img src="../css/2017_style/img/team/{{ post.thumbnail }}" class="img-responsive img-centered" style="max-width: 350px; min-width: 350px; max-height: 370px; min-height: 370px;" alt="../css/2017_style/img/logo-small-transparent.png">
                    </a>
                    <div class="speakers-caption">
                        <h4>{{ post.title }}</h4>
                        <p class="text-muted">{{ post.subtitle }}</p>
                        <p class="text-muted" style="max-height: 400px; min-height: 350px; padding: 5px;">{{ post.description }}</p>
                    </div>
                </div>
            {% endfor %}
            </div>
        </div>
    </section>
