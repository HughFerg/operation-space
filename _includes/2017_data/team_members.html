<!-- Portfolio Grid Section -->
    <section id="speakers" class="bg-light-gray">
        <div class="container">
            <div class="row">
            </div>
            <div class="row">
                <div class="col-lg-12 text-center team-title">
                    <h2 class="section-heading" style="z-index: 100;">Our Team</h2>
                </div>
            {% for post in site.categories.2017_teams %}
                <div class="col-md-4 col-sm-6 speakers-item">
                    <a class="speakers-link gandul" data-toggle="modal">
                        <div class="speakers-hover">
                            <div class="speakers-hover-content">
                                <i class="fa fa-3x"></i>
                            </div>
                        </div>
                        <div class="image-reponsive headshot-img" style="background-image: url('../css/2017_style/img/team/{{ post.thumbnail }}');"> 
                        </div>
                    </a>
                    <div class="speakers-caption">
                        <h4>{{ post.title }}</h4>
                        <p class="text-muted" style="height: 40px; padding: 5px; font-weight: bolder">{{ post.subtitle }}</p>
                        <p class="text-muted" style="height: 370px; padding: 5px;">{{ post.description }}</p>
                    </div>
                </div>
            {% endfor %}
            </div>
        </div>
    </section>
