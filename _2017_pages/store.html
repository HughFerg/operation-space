---
layout: store_layout
permalink: /store              
title: Store
---
<section id="donatePageWrap" style="padding-bottom: 0px;">
    <div class="conatiner">
        <div class="row">
            <div class="col-lg-12 text-center" style="padding-top: 3%;">
                <h1>Support us with our official merchandise!</h1>
                <br>
            </div>
        </div>
        <div class="row store-row">
            <div>
                {% for product in site.categories.products %}
                <div class="col-md-3 product">
                    <a href="{{ product.url | prepend: site.baseurl }}">
                        <div class="image-reponsive product-img" style="background-image: url('../css/2017_style/img/products/{{ product.img }}');">
                        </div>
                    </a>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
