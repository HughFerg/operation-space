---
layout: store_layout
permalink: /store              
title: Store
---

<section id="donatePageWrap">
    <div class="conatiner">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h1>Support us with our official merchandise!</h1>
                <br>
            </div>
        </div>
        <div class="row" style="padding-top: 5%;">
            {% for product in site.categories.products %}
            <div class="col-md-4" style="padding-top: 5%;">
                <center>
                    <a href="{{ product.url | prepend: site.baseurl }}">
                        <div class="image-reponsive" style="background-image: url('../css/2017_style/img/products/{{ product.img }}'); 
                        background-size: cover; background-position: center; width: 250px; height: 270px;">
                        </div>
                    </a>
                </center>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
